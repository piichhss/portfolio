<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pich Sann, photographer and video artist based in Belgium.">
<style>html, body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
<title>Pich Sann</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pich Sann">
<meta property="og:title" content="Pich Sann — photography and film">
<meta property="og:description" content="Photographer and video artist based in Belgium. Series Canvas, Amelie, Boy, and the films What Time Leaves Behind and Screenagers.">
<meta property="og:url" content="https://ideaspot.online/">
<meta property="og:image" content="https://ideaspot.online/pictures/canvas/canvas.jpg">
<meta property="og:image:alt" content="Canvas I, a printed canvas laid on a bare back, by Pich Sann">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141414'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='28' letter-spacing='2' fill='%23ecebe6'%3EPS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&family=Jost:wght@300;400&family=Kantumruy+Pro:wght@300;400&display=swap">
<style>
  /* Layout: one centered column on a near-black wall, like a screening room; the work is the only object. */
  :root {
    --wall: #141414;
    --mark: #ecebe6;
    --link: #b9b9b4;
    --active: #9fb4bd;
    --current: #ffffff;
    --caption: #8f8f8a;
    --frame: #222222;
    --serif: "Cormorant SC", "Trajan Pro", "Cormorant Garamond", Georgia, serif;
    --sans: "Futura PT", "Jost", "Kantumruy Pro", Futura, "Century Gothic", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--wall); }
  body {
    background: var(--wall);
    color: var(--link);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 14px;
    line-height: 1.7;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 120px;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; transition: color .25s ease; }
  a:hover { color: var(--active); }
  a:focus-visible, button:focus-visible { outline: 1px solid var(--link); outline-offset: 4px; }
  ::selection { background: var(--active); color: var(--link); }

  /* Header */
  header { text-align: center; padding-top: 40px; position: relative; }
  .wordmark {
    display: inline-block;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    letter-spacing: .32em;
    margin-right: -.32em;
    color: var(--mark);
    text-transform: uppercase;
  }
  .wordmark:hover { color: var(--mark); }
  nav.main {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 24px;
  }
  nav.main a, .overlay a {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--link);
  }
  nav.main a[aria-current="page"], .overlay a[aria-current="page"] {
    color: var(--current); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px;
  }
  .lang-row { max-width: 1100px; margin: 14px auto 0; display: flex; justify-content: flex-end; gap: 14px; }
  .lang[aria-pressed="true"] { color: var(--current); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  /* Letter-spacing pulls Khmer clusters apart, so Khmer text is set without it. */
  html[lang="km"] body *:not(.wordmark) { letter-spacing: 0 !important; }
  .lang {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-family: var(--sans); font-size: 11px; letter-spacing: .08em;
    color: var(--link); transition: color .25s ease;
  }
  .lang:hover { color: var(--active); }
  /* Language picker: one "Language" button that opens a small pop-up with the four languages. */
  .lang-wrap { position: relative; }
  .lang-toggle {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-family: var(--sans); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--link); transition: color .25s ease;
  }
  .lang-toggle:hover, .lang-toggle[aria-expanded="true"] { color: var(--active); }
  .lang-toggle::after {
    content: ""; display: inline-block; margin-left: 8px; vertical-align: middle;
    border-style: solid; border-width: 4px 3.5px 0 3.5px; border-color: currentColor transparent transparent transparent;
    transition: transform .25s ease;
  }
  .lang-toggle[aria-expanded="true"]::after { transform: rotate(180deg); }
  .lang-menu {
    position: absolute; right: 0; top: calc(100% + 10px); z-index: 25;
    display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    padding: 14px 18px; background: var(--wall); border: 1px solid #3a3a38;
    opacity: 0; visibility: hidden; transform: translateY(-4px); pointer-events: none;
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
  }
  .lang-menu.open { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }
  .menu-btn {
    display: none;
    margin: 18px auto 0;
    background: none; border: 0; padding: 4px 8px; cursor: pointer;
    font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--link);
  }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: var(--wall);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .overlay a { font-size: 14px; }
  .overlay .close { position: absolute; top: calc(40px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }

  @media (max-width: 760px) {
    nav.main { display: none; }
    .menu-btn { display: block; }
  }

  /* Pages */
  main { margin-top: 72px; transition: opacity .35s ease; }
  main.fading { opacity: 0; }
  .page { max-width: 1100px; margin: 0 auto; }
  .narrow { max-width: 640px; margin: 0 auto; }
  h1.page-title {
    font-family: var(--sans); font-weight: 400; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--link); text-align: center; margin: 0 0 64px;
  }
  .caption { font-size: 12px; color: var(--caption); margin-top: 14px; line-height: 1.5; }
  .center { text-align: center; }

  /* Media */
  .media { width: 90%; max-width: 1100px; margin: 0 auto; }
  .frame16 {
    position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
    background: var(--frame); overflow: hidden;
  }
  .frame16 img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame16 iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  .play span {
    width: 0; height: 0; border-style: solid; border-width: 14px 0 14px 24px;
    border-color: transparent transparent transparent var(--link); opacity: .85; transition: opacity .25s ease;
  }
  .frame16:hover .play span { opacity: 1; border-left-color: var(--active); }

  img.lazy { opacity: 0; transition: opacity .6s ease; }
  img.lazy.in { opacity: 1; }

  /* Index grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 96px 88px;
    max-width: 900px; margin: 0 auto;
  }
  .grid a { display: block; text-align: center; }
  .grid .thumb { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; background: var(--frame); overflow: hidden; }
  .grid .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid .t { display: block; margin-top: 14px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--link); }
  .grid a:hover .t { color: var(--active); }

  /* Series */
  .series .works { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 64px 56px; }
  .series figure { margin: 0; text-align: center; max-width: 100%; }
  .series figure img { display: block; margin: 0 auto; height: min(40vh, 360px); width: auto; max-width: 100%; object-fit: contain; cursor: zoom-in; }
  .series .back { display: block; text-align: center; margin-top: 112px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }

  /* Enlarged view */
  .viewer {
    position: fixed; inset: 0; z-index: 30; background: var(--wall);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    opacity: 0; pointer-events: none; transition: opacity .3s ease; cursor: zoom-out;
  }
  .viewer.open { opacity: 1; pointer-events: auto; }
  .viewer img { max-width: 100%; max-height: 84vh; width: auto; height: auto; display: block; }
  .series-intro { max-width: 600px; margin: -24px auto 88px; font-size: 13px; line-height: 1.85; color: var(--link); text-wrap: pretty; }
  .series-intro em { font-style: italic; }

  /* Video */
  .videos .media { margin-bottom: 140px; }
  /* On the Video page the wordmark becomes the barcode watermark used in the films. */
  .wordmark .wm-logo { display: none; }
  .wordmark .wm-logo { line-height: 1; }
  .wordmark .wm-logo img { display: block; width: min(300px, 70vw); height: auto; margin: 0 auto 6px; }
  html[data-page="video"] .wordmark .wm-text { display: none; }
  html[data-page="video"] .wordmark .wm-logo { display: block; }  .video-desc { max-width: 640px; margin: 28px auto 0; font-size: 13px; line-height: 1.8; color: var(--caption); }

  /* Shop */
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 72px 48px; max-width: 1000px; margin: 0 auto; }
  @media (min-width: 521px) and (max-width: 900px) { .shop-grid { grid-template-columns: repeat(2, 1fr); } }
  .print { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .print-img { display: block; aspect-ratio: 4 / 5; max-width: 100%; background: var(--frame); }
  .print-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .print-title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--link); }
  .print select {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 13px; color: var(--link);
    background: var(--wall); border: 1px solid #3a3a38; border-radius: 0; cursor: pointer;
  }
  .print select:focus-visible { outline: 1px solid var(--link); outline-offset: 2px; }
  .print select:disabled { cursor: default; opacity: 1; color: var(--link); appearance: none; }
  .buy {
    display: block; text-align: center; padding: 11px 12px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    border: 1px solid var(--link); color: var(--current); transition: background .25s ease, color .25s ease;
  }
  a.buy:hover { background: var(--current); color: var(--wall); }
  .buy.soon { border-color: #3a3a38; color: var(--caption); cursor: default; }
  .shop-notice {
    max-width: 600px; margin: -24px auto 48px; padding: 14px 18px; text-align: center; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--current); border: 1px solid #3a3a38;
  }
  .shop .shop-notice + .series-intro { margin-top: 0; }
  .nowrap { white-space: nowrap; }
  .shop-shipping { max-width: 600px; margin: -24px auto 64px; text-align: center; font-size: 13px; line-height: 1.9; letter-spacing: .04em; color: var(--current); }
  .shop-note { max-width: 600px; margin: 112px auto 0; text-align: center; font-size: 13px; color: var(--caption); }
  .shop-note a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
  .shop-info { max-width: 640px; margin: 120px auto 0; padding-top: 48px; border-top: 1px solid #2a2a28; font-size: 12px; line-height: 1.8; color: var(--caption); }
  .shop-info h2 { margin: 28px 0 6px; }
  .shop-info .shop-info-title { margin-top: 0; text-align: center; }
  .shop-info p { margin: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Home reel: the recent films crossfade into each other, each still drifting slowly closer. */
  .reel { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: var(--frame); overflow: hidden; }
  .reel .frame16 { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
  .reel .frame16.on { opacity: 1; pointer-events: auto; }
  .reel .frame16.photo { background: var(--wall); }
  .reel .frame16.photo img { object-fit: contain; }
  .reel .frame16 img { transform: scale(1); transform-origin: 50% 50%; }
  .reel .frame16.on img.in { animation: drift 5s linear forwards; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.07); } }
  .reel-caps { display: grid; }
  .reel-caps .caption { grid-area: 1 / 1; opacity: 0; transition: opacity 1.4s ease; }
  .reel-caps .caption.on { opacity: 1; }
  .reel-dots { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .reel-dots button { width: 28px; height: 14px; padding: 0; border: 0; background: none; cursor: pointer; position: relative; }
  .reel-dots button::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 1px; background: var(--link); opacity: .45; transition: opacity .3s ease, background .3s ease; }
  .reel-dots button[aria-current="true"]::after { opacity: 1; background: var(--active); }
  @media (prefers-reduced-motion: reduce) { .reel .frame16.on img.in { animation: none; } }

  /* Text pages */
  .text h2 {
    font-family: var(--sans); font-weight: 400; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--link); margin: 72px 0 20px;
  }
  .text h2:first-child { margin-top: 0; }
  .text p { margin: 0 0 18px; }
  .chron { list-style: none; margin: 0; padding: 0; }
  .chron li { display: grid; grid-template-columns: 88px 1fr; gap: 16px; margin-bottom: 10px; }
  .chron li span:first-child { font-variant-numeric: tabular-nums; color: var(--caption); }
  .chron li span:last-child { min-width: 0; }
  .chron a, .series-intro a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .contact p { margin: 0 0 40px; }
  .contact a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .contact .label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--caption); margin-bottom: 4px; }
  .note { font-size: 11px; color: var(--caption); margin-top: 8px; }

  @media (max-width: 520px) {
    main { margin-top: 56px; }
    .media { width: 100%; }
    .grid { gap: 72px; grid-template-columns: 1fr; max-width: 320px; }
    .series .works { gap: 32px 16px; align-items: flex-start; }
    .series figure { flex: 0 0 calc(50% - 8px); }
    .series figure img { width: 100%; height: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>


<header>
  <a class="wordmark" href="#home" aria-label="Pich Sann"><span class="wm-text">Pich Sann</span><span class="wm-logo" aria-hidden="true"><img src="pictures/video/video-barcode.png" alt=""><span>Pich Sann</span></span></a>
  <nav class="main" id="nav" aria-label="Main"></nav>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="overlay">Menu</button>
  <div class="lang-row">
    <div class="lang-wrap" id="langRow">
      <button class="lang-toggle" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu">Language</button>
      <div class="lang-menu" id="langMenu">
        <button class="lang" type="button" data-lang="en" aria-pressed="true">English</button>
        <button class="lang" type="button" data-lang="fr" aria-pressed="false" lang="fr">Français</button>
        <button class="lang" type="button" data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
        <button class="lang" type="button" data-lang="km" aria-pressed="false" lang="km">ខ្មែរ</button>
      </div>
    </div>
  </div>
</header>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Menu">
  <button class="menu-btn close" id="closeBtn" style="display:inline-block">Close</button>
  <div id="overlayLinks" style="display:flex;flex-direction:column;align-items:center;gap:22px"></div>
</div>

<main id="main"></main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Enlarged artwork">
  <img id="viewerImg" alt="">
  <div class="caption" id="viewerCap"></div>
</div>

<script>
(function () {
  var NAV = [
    { id: "home", en: "Home", fr: "Accueil", ja: "ホーム", km: "ទំព័រដើម" },
    { id: "artworks", en: "Artworks", fr: "Œuvres", ja: "作品", km: "ស្នាដៃសិល្បៈ" },
    { id: "video", en: "Video", fr: "Vidéo", ja: "映像", km: "វីដេអូ" },
    { id: "biography", en: "Biography", fr: "Biographie", ja: "略歴", km: "ជីវប្រវត្តិ" },
    { id: "works", en: "Works", fr: "Liste des œuvres", ja: "作品リスト", km: "បញ្ជីស្នាដៃ" },
    { id: "shop", en: "Shop", fr: "Boutique", ja: "ショップ", km: "ហាង" },
    { id: "contact", en: "Contact", fr: "Contact", ja: "お問い合わせ", km: "ទំនាក់ទំនង" }
  ];
  var lang = "en";

  /* ---------- placeholder images (flat greys, drawn as SVG) ---------- */
  function svg(w, h, body, bg) {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<rect width="100%" height="100%" fill="' + bg + '"/>' + body + '</svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
  }
  var motifs = {
    horizon: function (w, h, i) {
      var y = h * (0.5 + (i % 3 - 1) * 0.02);
      return svg(w, h, '<rect y="' + y + '" width="' + w + '" height="' + (h - y) + '" fill="' + ["#5c5c5c", "#4f4f4f", "#666"][i % 3] + '"/>', ["#a3a3a3", "#9a9a9a", "#b0b0b0"][i % 3]);
    },
    screen: function (w, h, i) {
      var sw = w * 0.42, sh = sw * 0.45;
      return svg(w, h, '<rect x="' + (w - sw) / 2 + '" y="' + h * 0.3 + '" width="' + sw + '" height="' + sh + '" fill="#e6e6e6"/>' +
        '<rect y="' + h * 0.78 + '" width="' + w + '" height="' + h * 0.22 + '" fill="#2b2b2b"/>', ["#3a3a3a", "#343434", "#404040"][i % 3]);
    },
    bolt: function (w, h, i) {
      var x = w * (0.35 + 0.1 * (i % 3)), pts = [], y = 0;
      while (y < h) { pts.push(x.toFixed(0) + "," + y.toFixed(0)); x += (Math.sin(y * 0.07 + i) * 24); y += h / 14; }
      pts.push(x.toFixed(0) + "," + h);
      return svg(w, h, '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#d8d8d8" stroke-width="1.6"/>', "#1f1f1f");
    },
    diorama: function (w, h, i) {
      return svg(w, h, '<rect y="' + h * 0.72 + '" width="' + w + '" height="' + h * 0.28 + '" fill="#6b6b6b"/>' +
        '<rect x="' + w * (0.3 + 0.08 * (i % 3)) + '" y="' + h * 0.48 + '" width="' + w * 0.1 + '" height="' + h * 0.26 + '" fill="#454545"/>' +
        '<rect x="' + w * 0.56 + '" y="' + h * 0.58 + '" width="' + w * 0.16 + '" height="' + h * 0.15 + '" fill="#555"/>', "#8c8c8c");
    },
    blocks: function (w, h, i) {
      return svg(w, h, '<rect x="' + w * 0.2 + '" y="' + h * (0.18 + 0.03 * i) + '" width="' + w * 0.34 + '" height="' + h * 0.82 + '" fill="#8a8a8a"/>' +
        '<rect x="' + w * 0.58 + '" y="' + h * 0.38 + '" width="' + w * 0.22 + '" height="' + h * 0.62 + '" fill="#9d9d9d"/>', "#c4c4c4");
    },
    room: function (w, h, i) {
      return svg(w, h, '<polygon points="0,' + h + ' ' + w * 0.3 + ',' + h * 0.62 + ' ' + w * 0.7 + ',' + h * 0.62 + ' ' + w + ',' + h + '" fill="#6e6e6e"/>' +
        '<rect x="' + w * 0.3 + '" y="' + h * 0.2 + '" width="' + w * 0.4 + '" height="' + h * 0.42 + '" fill="' + ["#b9b9b9", "#a8a8a8", "#c6c6c6"][i % 3] + '"/>', "#888");
    },
    stone: function (w, h, i) {
      return svg(w, h, '<rect y="' + h * 0.66 + '" width="' + w + '" height="' + h * 0.34 + '" fill="#9b9b9b"/>' +
        '<rect x="' + w * (0.44 + 0.03 * i) + '" y="' + h * 0.3 + '" width="' + w * 0.06 + '" height="' + h * 0.36 + '" fill="#4d4d4d"/>', "#b5b5b5");
    }

      (s.intro ? '<p class="series-intro">' + L(s.intro) + '</p>' : '') + '<div class="works">' +
      s.works.map(function (w, i) {
        var src = w[2] || (tall ? motifs[s.motif](1000, 1250, i) : motifs[s.motif](1500, 1150, i));
        var year = w[1] ? (lang === "ja" ? w[1] + "年" : w[1]) : "";
        var cap = [L(w[0]), year, s.medium ? L(s.medium) : ""].filter(Boolean).join(lang === "ja" ? "、" : ", ");
        return '<figure>' + img(src, L(w[0])) + '<figcaption class="caption">' + cap + '</figcaption></figure>';
      }).join("") + '</div>' +
      '<a class="back" href="#' + backId + '">' + L(backLabel) + '</a></section>';
  }
  function chron(rows) {
    return '<ul class="chron">' + rows.map(function (r) { return '<li><span>' + r[0] + '</span><span>' + L(r[1]) + '</span></li>'; }).join("") + '</ul>';
  }
  function h(title) { return '<h2>' + L(title) + '</h2>'; }

  /* ---------- pages ---------- */
  var PAGES = {
    home: function () { return '<section class="page">' + reelBlock(HOME_REEL) + '</section>'; },
    artworks: function () { return indexPage(ARTWORKS, ["Artworks", "作品"]); },
    video: function () {
      return '<section class="page videos"><h1 class="page-title visually-hidden">' + L(["Video", "映像"]) + '</h1>' + VIDEOS.map(function (v) { return videoBlock(v, true); }).join("") + '</section>';
    },
    biography: function () {
      return '<section class="narrow text"><h1 class="page-title">' + L(["Biography", "略歴"]) + '</h1>' +
        '<p>' + L(["Pich Sann is a photographer and video artist based in Belgium, with a passion for skateboarding. He began secondary school in 2019 at Don Bosco Halle, studying graphic design, and in 2022 moved to Sint-Lukas Brussels to study audiovisual and visual arts, graduating in 2025. He then studied photography at Kunstinstituut Gent, graduating in 2026, and now continues his photography studies at Narafi in Brussels.",
          "ピッチ・サンは、ベルギーを拠点に活動する写真家・映像作家。スケートボードに情熱を注ぐ。2019年にDon Bosco HalleでGraphic Designを学び始め、2022年にSint-Lukas Brusselsへ移ってAudiovisual and Visual Artsを専攻し、2025年に卒業。その後Kunstinstituut GentでPhotographyを学んで2026年に卒業し、現在はNarafi BrusselsでPhotographyを学び続けている。"]) + '</p>' +
        '<p>' + L(["He started skateboarding in 2020. It gave him another way of seeing: an eye for the city, for movement, and for the moments in between, which carries through into both his photographs and his films.",
          "2020年にスケートボードを始めたことで、物の見方にもうひとつの視点が加わった。街、動き、そしてその間にある瞬間へのまなざしは、写真と映像の両方に通じている。"]) + '</p>' +
        h(["Education", "学歴"]) + chron([
          ["2026–", ["Photography, Narafi, Brussels (current)", "Photography, Narafi, Brussels（在学中）"]],
          ["2025–2026", ["Photography, Kunstinstituut Gent", "Photography, Kunstinstituut Gent"]],
          ["2022–2025", ["Audiovisual and Visual Arts, Sint-Lukas Brussels", "Audiovisual and Visual Arts, Sint-Lukas Brussels"]],
          ["2019–2022", ["Graphic Design, Don Bosco Halle", "Graphic Design, Don Bosco Halle"]]]) +
        h(["Exhibitions", "展覧会"]) + chron([
          ["2026", ["End-of-year exhibition, Kunstinstituut Gent (open to the public)", "学年末展、Kunstinstituut Gent（一般公開）"]],
          ["2025", ["Graduation exhibition, Sint-Lukas Brussels (open to the public)", "卒業展、Sint-Lukas Brussels（一般公開）"]]]) +
        '</section>';
    },
    works: function () {
      return '<section class="narrow text"><h1 class="page-title">' + L(["Works", "作品リスト"]) + '</h1>' +
        h(["Film", "映像作品"]) + chron([
          ["2026", ["<a href=\"#video\">Screenagers</a>, skate film, filmed and edited", "<a href=\"#video\">『Screenagers』</a>スケートフィルム、撮影・編集"]],
          ["2026", ["<a href=\"#video\">What Time Leaves Behind</a>, end-of-year project, Kunstinstituut Gent", "<a href=\"#video\">『時が残すもの』</a>、学年末制作、Kunstinstituut Gent"]],
          ["2024–2025", ["<a href=\"#video\">Trial and Error</a>, final art exam film, Sint-Lukas Brussels", "<a href=\"#video\">『Trial and Error』</a>、卒業試験の映像作品、Sint-Lukas Brussels"]]]) +
        h(["Photographic Series", "写真シリーズ"]) + chron([
          ["2025", ["<a href=\"#canvas\">Canvas</a>, 5 photographs", "<a href=\"#canvas\">キャンバス</a>、写真5点"]],
          ["2026", ["<a href=\"#amelie\">Amelie</a>, 4 photographs", "<a href=\"#amelie\">Amelie</a>、写真4点"]],
          ["2026", ["<a href=\"#boy\">Boy</a>, 7 photographs", "<a href=\"#boy\">少年</a>、写真7点"]],
          ["2025", ["<a href=\"#analysis\">Analysis</a>, 6 works", "<a href=\"#analysis\">分析</a>、作品6点"]],
          ["2026", ["<a href=\"#untitled\">Untitled</a>, 2 photographs, taken while filming What Time Leaves Behind", "<a href=\"#untitled\">無題</a>、写真2点、『時が残すもの』撮影中に撮影"]]]) +
        '</section>';
    },
    shop: function () {
      return '<section class="page shop"><h1 class="page-title">' + L(["Shop", "ショップ"]) + '</h1>' +
        (shopOpen() ? '' : '<p class="shop-notice">' + L(SHOP_OPENS_TEXT) + (lang === "ja" ? "。" : lang === "km" ? "។ " : ". ") + L(["Until then, you can browse the prints below.", "それまでは、下のプリントをご覧いただけます。"]) + '</p>') +
        '<p class="series-intro">' + L([SHOP_INTRO, "すべてのプリントは受注制作で、Ilford Prestige Smooth Pearl（310g、細かなパール面で深い黒と繊細なディテールを保つ写真用紙）にインクジェットで印刷します。"]) + '</p>' +
        '<p class="shop-shipping">' + L([SHOP_SHIPPING, "送料（お支払い時にお選びください）：<br>ベルギー – 追跡付き配送 · €7 · <span class=\"nowrap\">3〜5営業日</span><br>その他のヨーロッパ – 追跡付き配送 · €15 · <span class=\"nowrap\">12〜20営業日</span>"]) + '</p>' +
        '<div class="shop-grid">' + SHOP.map(shopItem).join("") + '</div>' +
        '<p class="shop-note">' + L(["Limited editions of <em>Canvas</em>, <em>Amelie</em> and <em>Boy</em> are available on request. <a href=\"#contact\">Get in touch</a>.",
          "『キャンバス』『Amelie』『少年』の限定エディションはご相談に応じます。<a href=\"#contact\">お問い合わせ</a>ください。"]) + '</p>' +
        shopInfo() +
        '</section>';
    },
    contact: function () {
      return '<section class="narrow text contact"><h1 class="page-title">' + L(["Contact", "お問い合わせ"]) + '</h1>' +
        '<p><span class="label">' + L(["Email", "メール"]) + '</span><span style="user-select:all">pichsannz@gmail.com</span></p>' +
        '<p><span class="label">Instagram</span><a href="https://www.instagram.com/mp4.j3g/" target="_blank" rel="noopener">@mp4.j3g</a></p>' +
        '</section>';
    }
  };
  ARTWORKS.forEach(function (s) { PAGES[s.id] = function () { return seriesPage(s, "artworks", ["Back to Artworks", "作品一覧へ戻る"]); }; s.parent = "artworks"; });
  function parentOf(id) {
    var all = ARTWORKS;
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i].parent;
    return id;
  }

  /* ---------- nav ---------- */
  var navEl = document.getElementById("nav");
  var overlayLinks = document.getElementById("overlayLinks");
  var overlay = document.getElementById("overlay");
  var menuBtn = document.getElementById("menuBtn");
  function renderNav(current) {
    var active = parentOf(current);
    var html = NAV.map(function (n) {
      return '<a href="#' + n.id + '"' + (n.id === active ? ' aria-current="page"' : "") + '>' + n[lang] + '</a>';
    }).join("");
    navEl.innerHTML = html;
    overlayLinks.innerHTML = html;
  }
  function setMenu(open) {
    overlay.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    document.body.style.overflow = open ? "hidden" : "";
  }
  menuBtn.addEventListener("click", function () { setMenu(true); });
  document.getElementById("closeBtn").addEventListener("click", function () { setMenu(false); });
  overlayLinks.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false); });
  /* ---------- enlarged view ---------- */
  var viewer = document.getElementById("viewer");
  var viewerImg = document.getElementById("viewerImg");
  function setViewer(open) {
    viewer.classList.toggle("open", open);
    document.body.style.overflow = open ? "hidden" : "";
  }
  document.getElementById("main").addEventListener("click", function (e) {
    var im = e.target.closest(".series figure img");
    if (!im) return;
    viewerImg.src = im.src;
    viewerImg.alt = im.alt;
    document.getElementById("viewerCap").textContent = im.nextElementSibling ? im.nextElementSibling.textContent : "";
    setViewer(true);
  });
  viewer.addEventListener("click", function () { setViewer(false); });

  /* Shop: picking a size swaps in that size's payment link. */
  document.getElementById("main").addEventListener("change", function (e) {
    if (!e.target.matches(".shop select.size")) return;
    var box = e.target.closest(".print");
    var p = SHOP.filter(function (x) { return x.id === box.dataset.id; })[0];
    box.querySelector(".buy-wrap").innerHTML = buyControl(p, e.target.value);
  });

  /* Self-hosted (e.g. GitHub Pages) the page is the top window and YouTube can play in place;
     inside the claude.ai frame embedding is blocked, so the link opens YouTube instead. */
  document.getElementById("main").addEventListener("click", function (e) {
    var a = e.target.closest(".videos .frame16[data-yt]");
    if (!a || window.self !== window.top) return;
    e.preventDefault();
    a.outerHTML = '<div class="frame16"><iframe src="https://www.youtube-nocookie.com/embed/' + a.dataset.yt +
      '?autoplay=1&start=' + a.dataset.start + '" title="' + a.getAttribute("aria-label") +
      '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { setMenu(false); setViewer(false); setLangMenu(false); } });

  var langRow = document.getElementById("langRow");
  function setLang(next) {
    lang = next;
    document.documentElement.lang = lang;
    langRow.querySelectorAll(".lang").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    menuBtn.textContent = L(["Menu", "メニュー"]);
    document.getElementById("closeBtn").textContent = L(["Close", "閉じる"]);
    langBtn.textContent = LANG_LABEL[lang];
    var y = window.scrollY;
    render(false);
    window.scrollTo(0, y);
  }
  /* The "Language" button opens and closes the pop-up; picking a language, clicking elsewhere or Escape closes it. */
  var langBtn = document.getElementById("langBtn");
  var langMenu = document.getElementById("langMenu");
  var LANG_LABEL = { en: "Language", fr: "Langue", ja: "言語", km: "ភាសា" };
  function setLangMenu(open) {
    langMenu.classList.toggle("open", open);
    langBtn.setAttribute("aria-expanded", String(open));
  }
  langBtn.addEventListener("click", function () { setLangMenu(!langMenu.classList.contains("open")); });
  langRow.addEventListener("click", function (e) {
    var b = e.target.closest(".lang");
    if (!b) return;
    if (b.dataset.lang !== lang) setLang(b.dataset.lang);
    setLangMenu(false);
    langBtn.focus();
  });
  document.addEventListener("click", function (e) { if (!langRow.contains(e.target)) setLangMenu(false); });

  /* ---------- router + fade ---------- */
  var main = document.getElementById("main");
  /* Old series addresses still open the renamed series. */
  var RENAMED = { "girl": "untitled", "canvas-analysis": "analysis" };
  function current() {
    var h = location.hash.replace("#", "");
    h = RENAMED[h] || h;
    return PAGES[h] ? h : "home";
  }
  function fadeImages() {
    main.querySelectorAll("img.lazy").forEach(function (im) {
      if (im.complete) requestAnimationFrame(function () { im.classList.add("in"); });
      else im.addEventListener("load", function () { im.classList.add("in"); }, { once: true });
    });
  }
  function render(animate) {
    var id = current();
    var draw = function () {
      main.innerHTML = PAGES[id]();
      document.documentElement.setAttribute("data-page", id);
      renderNav(id);
      fadeImages();
      startReel();
      window.scrollTo(0, 0);
      main.classList.remove("fading");
    };
    if (animate) { main.classList.add("fading"); setTimeout(draw, 200); } else draw();
  }
  window.addEventListener("hashchange", function () { render(true); });
  render(false);
})();
</script>


</body>
</html>
